name: test-ninja-msvc
on:
  push:
    branches: [ninja-msvc]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: windows-2025
    steps:
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vsPath) { Write-Error "Visual Studio not found"; exit 1 }
          Write-Host "Found VS at: $vsPath"
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"

          $envBefore = @{}
          Get-ChildItem env: | ForEach-Object { $envBefore[$_.Name] = $_.Value }

          cmd /c "`"$vcvarsall`" x64 >nul 2>&1 && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                  $k = $matches[1]
                  $v = $matches[2]
                  if ($k -ieq 'Path') {
                      $oldEntries = ($envBefore['Path'] -split ';') | Where-Object { $_ -ne '' }
                      ($v -split ';') | Where-Object { $_ -ne '' -and $_ -notin $oldEntries } | ForEach-Object {
                          Add-Content -Path $env:GITHUB_PATH -Value $_
                      }
                  } elseif (-not $envBefore.ContainsKey($k) -or $envBefore[$k] -ne $v) {
                      Add-Content -Path $env:GITHUB_ENV -Value "$k=$v"
                  }
              }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=cl"
          Write-Host "MSVC x64 environment exported (CC=cl, CXX=cl)"

      - name: Verify tools are available
        shell: bash
        run: |
          echo "=== cl.exe ==="
          cl 2>&1 | head -1 || echo "cl.exe not found"
          echo "=== ninja ==="
          ninja --version
          echo "=== cmake ==="
          cmake --version | head -1

      - name: Create hello world
        shell: bash
        run: |
          mkdir hello && cd hello
          cat > main.cpp << 'EOF'
          #include <iostream>
          int main() { std::cout << "Hello from Ninja + MSVC!" << std::endl; return 0; }
          EOF
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(hello LANGUAGES CXX)
          add_executable(hello main.cpp)
          EOF

      - name: Configure with Ninja
        shell: bash
        run: cmake -B hello/build -S hello -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build hello/build

      - name: Run
        shell: bash
        run: ./hello/build/hello.exe
